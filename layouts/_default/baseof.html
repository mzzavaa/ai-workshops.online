<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - AI Workshops{{ end }}</title>
  <meta name="description" content="{{ if .Params.description }}{{ .Params.description }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
  <meta property="og:title" content="{{ .Site.Title }}" />
  <meta property="og:description" content="{{ .Site.Params.description }}" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="{{ .Site.BaseURL }}" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" href="/favicon.png" sizes="512x512" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css?v={{ now.Unix }}" />
  <script>
    (function() {
      var t = localStorage.getItem('theme');
      if (t === 'light') { document.documentElement.classList.remove('dark'); }
      else               { document.documentElement.classList.add('dark'); }
    })();
  </script>
  <script async src="https://plausible.io/js/pa-d_GF9vcfjCMvVovDbnjBT.js"></script>
  <script>window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};plausible.init()</script>
</head>
<body>
  <!-- Parallax Orb Layer, luxury gradient backgrounds -->
  <div class="parallax-orbs" aria-hidden="true">
    <div class="parallax-orb parallax-orb--1"></div>
    <div class="parallax-orb parallax-orb--2"></div>
    <div class="parallax-orb parallax-orb--3"></div>
    <div class="parallax-orb parallax-orb--4"></div>
    <div class="parallax-orb parallax-orb--5"></div>
  </div>
  {{ block "main" . }}{{ end }}
  <script src="/js/main.js"></script>
</body>
</html>
